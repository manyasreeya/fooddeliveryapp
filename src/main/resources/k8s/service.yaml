apiVersion: v1
kind: Service
metadata:
  name: fooddelivery-service
  namespace: default
  labels:
    app: fooddelivery
    project: fusion-cloud
    environment: production
    managed-by: jenkins
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: fooddelivery
  type: LoadBalancer
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  sessionAffinity: None